training:
  model_name: "xlstm_uniprot_multilabel_cosine"
  task_type: "multilabel_classification"
  batch_size: 8   # Keep what worked before
  gradient_accumulation_steps: 1  # Keep what worked before
  lr: 8e-5  # Only slightly lower than working 1e-4
  lr_warmup_steps: 1000  # Keep reasonable warmup
  lr_scheduler_type: "cosine"  # Cosine annealing to break plateau
  lr_decay_until_steps: 50000  # Add this missing parameter
  max_steps: 50000
  lr_decay_factor: 0.1  # Not too aggressive
  weight_decay: 0.01  # Keep what worked before
  mixed_precision: "bf16"
  weight_precision: float32
  enable_mixed_precision: true
  num_epochs: 3
  output_dir: "output/xlstm_uniprot_multilabel_cosine"
  save_every_step: 3000
  log_every_step: 250   # Very frequent logging
  eval_every_step: 1500
  wandb_project: "xlstm_uniprot_multilabel_cosine"
  torch_compile: false

model:
  type: "xLSTMLMModel"
  num_blocks: 12
  embedding_dim: 768
  mlstm_block:
    mlstm:
      num_heads: 12
  slstm_block:
    slstm:
      num_heads: 12
  slstm_at: [3, 6, 9]
  context_length: 512

dataset:
  path: "data/uniprot/raw_data.csv"
  sequence_column: "Sequence"
  id_column: "Entry"
  train_path: "data/uniprot/melted_train_go_data.h5"
  valid_path: "data/uniprot/melted_valid_go_data.h5"
  test_path: "data/uniprot/melted_test_go_data.h5"
  
tokenizer:
  type: "file"
  path: "configs/protein_vocab.txt"
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  cls_token: "[CLS]"
  sep_token: "[SEP]"
  mask_token: "[MASK]"
