training:
  model_name: "xlstm_uniprot_multilabel_from_scratch"
  task_type: "multilabel_classification"
  batch_size: 8  # Increase batch size for better gradient estimates
  gradient_accumulation_steps: 1  # Reduce accumulation to get more frequent updates
  lr: 1e-4  # Much higher learning rate for training from scratch
  lr_warmup_steps: 2000  # Longer warmup for stability with higher learning rate
  lr_decay_until_steps: 200000  # Same as BERT max_steps
  max_steps: 200000  # Same as BERT max_steps
  lr_decay_factor: 0.1
  weight_decay: 0.01  # Same as BERT
  mixed_precision: "bf16"  # Switch to bf16 instead of fp16 for stability
  weight_precision: float32
  enable_mixed_precision: true
  num_epochs: 5 # May need more epochs when training from scratch
  output_dir: "output/xlstm_uniprot_multilabel_from_scratch"
  save_every_step: 10000  # Same as BERT save_steps
  log_every_step: 1000   # Same as BERT logging_steps
  eval_every_step: 5000  # Same as BERT eval_steps
  wandb_project: "xlstm_uniprot_multilabel_from_scratch"
  torch_compile: false  # DISABLED for faster startup

model:
  type: "xLSTMLMModel"
  num_blocks: 12
  embedding_dim: 768
  mlstm_block:
    mlstm:
      num_heads: 12
  slstm_block:
    slstm:
      num_heads: 12
  slstm_at: [3, 6, 9]
  context_length: 512

dataset:
  # Path to the CSV file containing sequences and IDs
  path: "data/uniprot/raw_data.csv"
  sequence_column: "Sequence"
  id_column: "Entry"
  
  # Paths to the HDF5 files containing the multi-hot encoded labels
  train_path: "data/uniprot/melted_train_go_data.h5"  # Renamed from h5_path for consistency
  valid_path: "data/uniprot/melted_valid_go_data.h5"  # Renamed from valid_h5_path for consistency
  test_path: "data/uniprot/melted_test_go_data.h5"    # Renamed from test_h5_path for consistency
  
tokenizer:
  type: "file"
  path: "configs/protein_vocab.txt"
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  cls_token: "[CLS]"
  sep_token: "[SEP]"
  mask_token: "[MASK]"
