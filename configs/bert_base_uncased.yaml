training:
  model_name: bert_base_uncased
  batch_size: 32
  lr: 5e-5
  lr_warmup_steps: 1000
  lr_decay_until_steps: 10000
  lr_decay_factor: 0.1
  weight_decay: 0.01
  amp_precision: bfloat16
  weight_precision: float32
  enable_mixed_precision: true
  num_epochs: 3
  output_dir: output/bert_base_uncased
  save_every_step: 100
  log_every_step: 10
  wandb_project: bert_base_uncased
  torch_compile: false
model:
  type: bert
  vocab_size: 30522
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  hidden_act: gelu
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  layer_norm_eps: 1e-12
  pad_token_id: 0
  position_embedding_type: absolute
  type_vocab_size: 2
  initializer_range: 0.02
  is_decoder: false
  add_pooling_layer: false
dataset:
  hugging_face_ids:
    - data/gene_ontology.json
tokenizer:
  type: pretrained
  pretrained_id: google-bert/bert-base-uncased
  fill_token: [MASK]
