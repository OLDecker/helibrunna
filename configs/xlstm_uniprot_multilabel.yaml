training:
  model_name: "xlstm_uniprot_multilabel"
  task_type: "classification"
  multilabel: true  # Enable multi-label classification
  batch_size: 16
  lr: 1e-5  # Lower learning rate for fine-tuning
  lr_warmup_steps: 1000
  lr_decay_until_steps: 50000
  lr_decay_factor: 0.1
  weight_decay: 0.01
  amp_precision: bfloat16
  weight_precision: float32
  enable_mixed_precision: true
  num_epochs: 3
  output_dir: "output/xlstm_uniprot_multilabel"
  save_every_step: 5000
  log_every_step: 100
  wandb_project: "xlstm_uniprot_multilabel"
  torch_compile: false
  
  # Load pre-trained weights
  pretrained_model_path: "output/xlstm_uniparc_pretrain"  # Path to pre-trained model

model:
  type: "xLSTMLMModel"
  num_blocks: 12  # Match pre-training architecture
  embedding_dim: 768
  mlstm_block:
    mlstm:
      num_heads: 12
  slstm_block:
    slstm:
      num_heads: 12
  slstm_at: [3, 6, 9]
  context_length: 512

dataset:
  # UniProt H5 files (same as BERT)
  train_path: "data/uniprot/melted_train_go_data.h5"
  valid_path: "data/uniprot/melted_valid_go_data.h5"
  test_path: "data/uniprot/melted_test_go_data.h5"
  
tokenizer:
  type: "file"
  path: "configs/protein_vocab.txt"
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  cls_token: "[CLS]"
  sep_token: "[SEP]"
