# This configuration is based on the Bio-xLSTM paper for a from-scratch 
# multilabel classification task on protein sequences.
# It uses mLSTM blocks with RoPE, as suggested for protein tasks.

# Overrides
training:
  model_name: xlstm_uniprot_bio_xlstm
  output_dir: ./output/xlstm_uniprot_bio_xlstm
  task_type: multilabel_classification
  batch_size: 16
  num_epochs: 10
  lr: 6.0e-4
  lr_scheduler_type: "cosine"
  lr_warmup_steps: 1000
  lr_decay_until_steps: "auto"
  lr_decay_factor: 0.1
  weight_decay: 0.1
  gradient_accumulation_steps: 4
  mixed_precision: "bf16"
  torch_compile: True
  wandb_project: "helibrunna"
  save_every_step: 5000
  log_every_step: 100
  eval_every_step: 5000

model:
  type: xlstm
  context_length: 1024
  vocab_size: 30 # Will be overridden by tokenizer size
  m_residual: True
  s_residual: True
  block_type: "mLSTM"
  num_blocks: 8
  embedding_dim: 512
  num_heads: 8
  head_dim: 64
  s_state_dim: 256
  m_state_dim: 256
  ff_mult: 2.0 # From Bio-xLSTM paper for proteins
  use_rope: True # Enable Rotary Position Embeddings for mLSTM
  use_abs_pos_emb: False
  optimizer:
    name: AdamW
    betas: [0.9, 0.95] # From Bio-xLSTM paper
    eps: 1.0e-8

dataset:
  type: protein_multilabel
  path: data/uniprot/uniprot_sprot_2024_03_mini.csv
  train_path: data/uniprot/go_term_matrix_train.h5
  val_path: data/uniprot/go_term_matrix_val.h5
  test_path: data/uniprot/go_term_matrix_test.h5
  sequence_column: "sequence"
  id_column: "id"
  label_columns: [] # Not needed for H5 format
  
tokenizer:
  type: bpe
  vocab_size: 30000
  add_special_tokens: True
  special_tokens:
    - "[PAD]"
    - "[UNK]"
    - "[CLS]"
    - "[SEP]"
    - "[MASK]"
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  cls_token: "[CLS]"
  sep_token: "[SEP]"
  mask_token: "[MASK]"
  fill_token: "[MASK]"
