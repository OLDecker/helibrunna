# This configuration is based on the Bio-xLSTM paper for a from-scratch 
# multilabel classification task on protein sequences.
# It uses mLSTM blocks with RoPE, as suggested for protein tasks.

# Overrides
training:
  model_name: xlstm_uniprot_bio_xlstm
  output_dir: ./output/xlstm_uniprot_bio_xlstm
  task_type: multilabel_classification
  batch_size: 16
  num_epochs: 10
  lr: 6.0e-4
  lr_scheduler_type: "cosine"
  lr_warmup_steps: 1000
  lr_decay_until_steps: "auto"
  lr_decay_factor: 0.1
  weight_decay: 0.1
  gradient_accumulation_steps: 4
  amp_precision: bfloat16
  weight_precision: float32
  enable_mixed_precision: true
  torch_compile: true
  wandb_project: "helibrunna"
  save_every_step: 5000
  log_every_step: 100
  eval_every_step: 5000

model:
  type: xLSTMLMModel
  context_length: 1024
  vocab_size: 23 # Will be overridden by tokenizer size
  num_blocks: 8
  embedding_dim: 512
  mlstm_block:
    mlstm:
      num_heads: 8
      backend: "cuda"
  slstm_block:
    slstm:
      num_heads: 8
      backend: "cuda"
  slstm_at: []  # Use only mLSTM blocks as recommended by Bio-xLSTM paper
  use_rope: True # Enable Rotary Position Embeddings for mLSTM
  use_abs_pos_emb: False
  optimizer:
    name: AdamW
    betas: [0.9, 0.95] # From Bio-xLSTM paper
    eps: 1.0e-8

dataset:
  type: protein_multilabel
  path: data/uniprot/raw_data.csv
  train_path: data/uniprot/melted_train_go_data.h5
  val_path: data/uniprot/melted_valid_go_data.h5
  test_path: data/uniprot/melted_test_go_data.h5
  sequence_column: "Sequence"
  id_column: "Entry"
  label_columns: [] # Not needed for H5 format
  
tokenizer:
  type: "wordlevel"
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  cls_token: "[CLS]"
  sep_token: "[SEP]"
  mask_token: "[MASK]"
